<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../static/stage.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script></head><body><div class="stage">
<svg viewBox="0 0 960 540"><defs><filter id="cl"><feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="4" seed="3"/><feColorMatrix type="matrix" values="0 0 0 0 .92  0 0 0 0 .95  0 0 0 0 1  0 0 0 1.6 -.55"/><feGaussianBlur stdDeviation="2"/></filter>

<rect id="sky" width="960" height="540" fill="url(#sky)"/>
<circle id="sun" cx="700" cy="150" r="140" fill="url(#sun)" opacity=".9"/>
<g id="far"><rect x="-960" y="260" width="2880" height="300" filter="url(#cl)" opacity=".55"/></g>

<path d="M380 346 q8 -10 16 0 q8 -10 16 0" fill="none" stroke="#1b1b24" stroke-width="2"/>
<path d="M420 354 q8 -10 16 0 q8 -10 16 0" fill="none" stroke="#1b1b24" stroke-width="2"/>
<path d="M460 362 q8 -10 16 0 q8 -10 16 0" fill="none" stroke="#1b1b24" stroke-width="2"/>
<path d="M500 370 q8 -10 16 0 q8 -10 16 0" fill="none" stroke="#1b1b24" stroke-width="2"/></g>
<ellipse id="shadow" cx="480" cy="470" rx="60" ry="14" fill="#07070a" opacity="0"/>
<rect id="vig" width="960" height="540" fill="url(#sun)" opacity="0"/></svg>
<script>window.scene=function(tl){
  gsap.set('#near,#mid,#far',{x:0}); gsap.set('svg',{transformOrigin:'50% 50%'});
  tl.to('#near',{x:-900,duration:12,ease:'none'},0); tl.to('#mid',{x:-520,duration:12,ease:'none'},0); tl.to('#far',{x:-220,duration:12,ease:'none'},0);

  tl.to('#sun',{opacity:1,scale:1.3,transformOrigin:'50% 50%',duration:1.5,yoyo:true,repeat:1},3.4);
  tl.to('#birds',{opacity:1,x:-700,y:60,duration:5,ease:'none'},4.0);
  tl.to('#shadow',{opacity:.35,x:40,duration:3,yoyo:true,repeat:1},5.5);
  tl.to('#vig',{opacity:.35,duration:1.2},10.6);

}</script>
